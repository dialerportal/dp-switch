# DialerPortal DP Switch — SIP digest auth failures.
# Kamailio writes a fixed-format line per failure from route[AUTH]:
#   ... DP-SWITCH auth failure user=<u> from=<ip> method=INVITE fails=<n>
# Registration scanners and credential-stuffing both land here.
[Definition]
failregex = DP-SWITCH auth failure user=\S* from=<HOST> method=\S+
            DP-SWITCH banning <HOST> after repeated auth failures
            DP-SWITCH pike flood from <HOST>
            DP-SWITCH malformed request from <HOST>
ignoreregex =
